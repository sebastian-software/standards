# Standalone for now — will be replaced by a stub calling the reusable
# workflow from sebastian-software/.github once that repository exists.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm agent:check

  action-pins:
    name: action pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The repository's own workflows and composite actions are held to the
      # rule the action publishes, with the action taken from the checkout.
      - uses: ./.github/actions/check-action-pins
        with:
          paths: |
            .github/workflows
            .github/actions
