# Rust CI skeleton — reference only, not seeded by `standards apply`.
#
# Rust repositories differ too much in features, platforms and extra gates for a
# byte-exact baseline, so this file is a starting point rather than a managed
# artifact. Copy it to `.github/workflows/ci.yml`, keep the repository's own
# richer jobs, and add whatever is missing here.
#
# A committed root `Cargo.lock` is a prerequisite: every cargo command below
# runs with `--locked`, libraries included, so dependency drift fails the build
# instead of resolving silently. Commit the lockfile before copying this file.
#
# Every action is pinned to a full commit SHA with the version in a trailing
# comment, and a `docker://` reference to an immutable `@sha256:` digest.
# Renovate updates the pins; never replace a SHA or digest with a tag.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  pr-title:
    name: conventional pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --all-features --locked

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      # `rust-version` in Cargo.toml is the single source of truth for the MSRV.
      # A README badge, justfile or docs page that restates the number is a copy
      # and must be derived from this one, never edited independently.
      # `cargo metadata` resolves `rust-version.workspace = true` and does not
      # care how the manifest is quoted or indented, which a regex would.
      - name: Read the declared MSRV
        id: msrv
        shell: bash
        run: |
          mapfile -t versions < <(
            cargo metadata --no-deps --format-version 1 |
              jq -r '[.packages[].rust_version | select(. != null)] | unique | .[]'
          )
          if [ "${#versions[@]}" -ne 1 ]; then
            echo "::error::expected exactly one rust-version across the workspace, found ${#versions[@]}: ${versions[*]}"
            exit 1
          fi
          echo "version=${versions[0]}" >> "$GITHUB_OUTPUT"
          echo "Declared MSRV is ${versions[0]}"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master branch
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      # The action only sets the rustup default, and `rust-toolchain.toml`
      # outranks that; a directory override outranks the file. Without this
      # line the lane would quietly check with whatever the file selects.
      - run: rustup override set "$MSRV"
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Benches and tests are checked too, so a bench-only MSRV regression
      # cannot hide behind a green build.
      - run: cargo check --workspace --all-targets --all-features --locked

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  standards:
    name: standards drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Guard: agent step not yet completed for this PR"
        run: test ! -f .standards/pending.json

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # minimum-release-age=0 mirrors the apply invocation in
      # renovate-config/standards.json: pnpm 11 defaults minimumReleaseAge to
      # 1440 (24h), so without the bypass `check` resolves the newest standards
      # older than a day while the stamp was written by apply against the true
      # latest — a freshly released version then reads as false drift.
      - run: pnpm --config.minimum-release-age=0 dlx @sebastian-software/standards check
