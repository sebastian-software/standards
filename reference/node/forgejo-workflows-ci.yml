name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    name: CI / Check
    runs-on: docker
    container:
      image: code.forgejo.org/oci/node:24-bookworm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run --if-present lint

      - run: pnpm run --if-present format:check

      - run: pnpm run --if-present typecheck

      - run: pnpm run --if-present build

      - run: pnpm run --if-present test

  standards:
    name: Standards / Consistency
    runs-on: docker
    container:
      image: code.forgejo.org/oci/node:24-bookworm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One shipped implementation owns markers, CLI alignment and exact pins.
      # Older CLIs reject the ci command instead of silently skipping guards.
      - run: pnpm exec standards ci
